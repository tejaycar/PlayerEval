name: Cleanup Branch Stack

on:
  pull_request:
    types: [closed]
  delete:

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Skip cleanup for main branch (production)
    if: |
      (github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'main')
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Determine branch name
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "delete" ]; then
            BRANCH="${{ github.event.ref }}"
          else
            BRANCH="${{ github.event.pull_request.head.ref }}"
          fi
          echo "name=$BRANCH" >> $GITHUB_OUTPUT

      - name: Compute stack name
        id: stack
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          # Must match the shortenBranch logic in bin/app.ts
          SANITIZED=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9]/-/g')
          if [ ${#SANITIZED} -gt 28 ]; then
            HASH=$(echo -n "$BRANCH" | sha256sum | cut -c1-8)
            SHORT_PREFIX="${SANITIZED:0:20}-${HASH}"
          else
            SHORT_PREFIX="$SANITIZED"
          fi
          STACK_NAME="PlayerEval-${SHORT_PREFIX}"
          echo "stack_name=$STACK_NAME" >> $GITHUB_OUTPUT
          echo "Destroying stack: $STACK_NAME (branch: $BRANCH)"

      - name: Check if stack exists
        id: check
        run: |
          if aws cloudformation describe-stacks --stack-name "${{ steps.stack.outputs.stack_name }}" 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Delete CloudFormation stack
        if: steps.check.outputs.exists == 'true'
        run: |
          STACK_NAME="${{ steps.stack.outputs.stack_name }}"
          echo "Requesting deletion of stack: $STACK_NAME"
          aws cloudformation delete-stack --stack-name "$STACK_NAME"

          echo "Waiting for stack deletion to complete..."
          if aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" 2>&1; then
            echo "Stack $STACK_NAME deleted successfully."
          else
            # Check if deletion failed due to DynamoDB delete protection
            STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "STACK_GONE")
            if [ "$STATUS" = "DELETE_FAILED" ]; then
              REASON=$(aws cloudformation describe-stack-events \
                --stack-name "$STACK_NAME" \
                --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].ResourceStatusReason" \
                --output text 2>/dev/null || echo "")
              echo "Stack deletion failed. Reason: $REASON"
              if echo "$REASON" | grep -qi "cannot be deleted.*protection\|delete protection\|DeletionProtection"; then
                echo "Deletion failed due to DynamoDB delete protection. This is expected and acceptable."
                exit 0
              fi
              echo "::warning::Stack deletion failed for a non-protection reason: $REASON"
              exit 0
            elif [ "$STATUS" = "STACK_GONE" ]; then
              echo "Stack no longer exists (already deleted)."
              exit 0
            else
              echo "::warning::Stack is in status: $STATUS after delete attempt."
              exit 0
            fi
          fi
