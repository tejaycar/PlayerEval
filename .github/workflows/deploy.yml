name: Deploy

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['main']

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build -w @player-eval/backend

      - name: Build frontend
        env:
          APP_VERSION: ${{ github.sha }}
        run: npm run build -w @player-eval/frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: Deploy CDK Stack
        working-directory: packages/infra
        env:
          BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          APP_VERSION: ${{ github.sha }}
        run: |
          cdk deploy --require-approval never

      - name: Get CloudFront URL
        id: get-url
        working-directory: packages/infra
        env:
          BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          ACTUAL_BRANCH="${BRANCH_NAME}"
          # Must match the shortenBranch logic in bin/app.ts
          SANITIZED=$(echo "$ACTUAL_BRANCH" | sed 's/[^a-zA-Z0-9]/-/g')
          if [ ${#SANITIZED} -gt 28 ]; then
            HASH=$(echo -n "$ACTUAL_BRANCH" | sha256sum | cut -c1-8)
            SHORT_PREFIX="${SANITIZED:0:20}-${HASH}"
          else
            SHORT_PREFIX="$SANITIZED"
          fi
          STACK_NAME=$([[ "$ACTUAL_BRANCH" == "main" ]] && echo "PlayerEval" || echo "PlayerEval-${SHORT_PREFIX}")
          URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" --output text)
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Install Playwright
        if: ${{ (github.event_name == 'pull_request' && github.head_ref || github.ref_name) != 'main' }}
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        if: ${{ (github.event_name == 'pull_request' && github.head_ref || github.ref_name) != 'main' }}
        env:
          BASE_URL: ${{ steps.get-url.outputs.url }}
          BYPASS_AUTH: 'true'
        run: npx playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
